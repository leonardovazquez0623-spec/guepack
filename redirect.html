<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GUEPACK – Redirigiendo...</title>
<link rel="apple-touch-icon" href="/Icono_gp.png">
<meta name="theme-color" content="#1a4fa0">
<link rel="icon" type="image/png" href="/Icono_gp.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0e3070;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Montserrat', sans-serif;
  }
  .estado {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    color: white;
    font-size: 14px;
    font-weight: 700;
  }
  .loader {
    display: flex;
    gap: 8px;
  }
  .dot {
    width: 10px; height: 10px;
    background: #f05a1a;
    border-radius: 50%;
    animation: bounce 1.2s infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.2s; background: white; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; }
    40% { transform: scale(1); opacity: 1; }
  }
</style>
</head>
<body>
<div class="estado" role="status" aria-live="polite">
  <div class="loader" aria-hidden="true">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>
  <div>Iniciando sesión...</div>
</div>

<script src="/supabase-local.js"></script>
<script src="/tenant-config.js"></script>
<script>
const SUPABASE_URL = 'https://zkrnjdsnuyjaxxnluzmn.supabase.co'
const SUPABASE_KEY = 'sb_publishable_nde3IHFs-CJqqY0w5gV77g_FbtKtH7z'
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { autoRefreshToken: true, persistSession: true, detectSessionInUrl: true }
})

let redireccionEnCurso = false
const parametrosUrl = new URLSearchParams(window.location.search)
const tenantSlug = (parametrosUrl.get('tenant') || 'guepack').trim().toLowerCase()

async function esperarTenantActual() {
  if (window.tenantConfigReady) {
    await Promise.race([
      window.tenantConfigReady,
      new Promise(resolve => setTimeout(resolve, 3000))
    ])
    return window.tenantConfig
  }
  if (window.tenantConfig) return window.tenantConfig

  await new Promise(resolve => {
    const temporizador = setTimeout(resolve, 3000)
    window.addEventListener('tenantLoaded', () => {
      clearTimeout(temporizador)
      resolve()
    }, { once: true })
  })
  return window.tenantConfig
}

async function redirigirPorRol(session) {
  if (!session?.user || redireccionEnCurso) return
  redireccionEnCurso = true

  const { data: tenantConsultado, error: errorTenant } = await db.from('tenants_publico')
    .select('id,tipo,slug,dominio')
    .eq('slug', tenantSlug)
    .eq('activo', true)
    .single()

  if (errorTenant) {
    console.warn('[redirect] No fue posible consultar el tenant solicitado:', errorTenant.message)
  }

  const tenantDetectado = await esperarTenantActual()
  const tenant = tenantConsultado || tenantDetectado || window.tenantConfig
  const tenantId = tenant?.id || 1
  const { data: rolData, error } = await db.from('usuario_tenant_roles')
    .select('rol')
    .eq('user_id', session.user.id)
    .eq('tenant_id', tenantId)
    .single()

  if (error) {
    console.warn('[redirect] No fue posible consultar el rol del tenant; se abrirá la vista de cliente:', error.message)
  }
  console.log('[redirect] tenant:', tenantId, 'rol:', rolData?.rol)

  const dominioPredeterminado = tenant?.slug === 'guepack'
    ? 'www.guepack.com'
    : `${tenant?.slug || 'guepack'}.guepack.com`
  const dominioTenant = String(tenant?.dominio || dominioPredeterminado).trim()
  let origenTenant
  try {
    const urlTenant = new URL(dominioTenant.includes('://') ? dominioTenant : `https://${dominioTenant}`)
    if (!['http:', 'https:'].includes(urlTenant.protocol) || !urlTenant.hostname) throw new Error('dominio no válido')
    urlTenant.protocol = 'https:'
    urlTenant.pathname = '/'
    urlTenant.search = ''
    urlTenant.hash = ''
    origenTenant = urlTenant.origin
  } catch (errorDominio) {
    console.warn('[redirect] Dominio del tenant no válido; se usará el dominio predeterminado:', errorDominio.message)
    origenTenant = `https://${dominioPredeterminado}`
  }

  if (tenant?.tipo === 'restaurante') {
    if (rolData?.rol === 'admin') window.location.replace(`${origenTenant}/cocina.html`)
    else window.location.replace(`${origenTenant}/menu.html`)
  } else if (rolData?.rol === 'admin') {
    window.location.replace(`${origenTenant}/admin.html`)
  } else if (rolData?.rol === 'repartidor') {
    window.location.replace(`${origenTenant}/repartidor.html`)
  } else {
    window.location.replace(`${origenTenant}/app.html`)
  }
}

db.auth.onAuthStateChange(async (evento, session) => {
  console.log('[redirect] evento:', evento, 'correo:', session?.user?.email)
  if (evento === 'SIGNED_IN' && session) {
    await redirigirPorRol(session)
  }
})

async function comprobarSesionInicial() {
  const { data: { session }, error } = await db.auth.getSession()
  if (error) {
    console.warn('[redirect] No fue posible comprobar la sesión inicial:', error.message)
  }
  if (session) {
    await redirigirPorRol(session)
    return
  }

  // Da tiempo al cliente de Supabase para procesar el callback de OAuth.
  await new Promise(resolve => setTimeout(resolve, 1500))
  const { data: { session: sesionReintento } } = await db.auth.getSession()
  if (sesionReintento) {
    await redirigirPorRol(sesionReintento)
    return
  }

  window.location.replace('/login.html')
}

comprobarSesionInicial()
</script>
</body>
</html>
