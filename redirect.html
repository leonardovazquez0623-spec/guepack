<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GUEPACK – Redirigiendo...</title>
<link rel="apple-touch-icon" href="/Icono_gp.png">
<meta name="theme-color" content="#1a4fa0">
<link rel="icon" type="image/png" href="/Icono_gp.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0e3070;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Montserrat', sans-serif;
  }
  .estado {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    color: white;
    font-size: 14px;
    font-weight: 700;
  }
  .loader {
    display: flex;
    gap: 8px;
  }
  .dot {
    width: 10px; height: 10px;
    background: #f05a1a;
    border-radius: 50%;
    animation: bounce 1.2s infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.2s; background: white; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; }
    40% { transform: scale(1); opacity: 1; }
  }
</style>
</head>
<body>
<div class="estado" role="status" aria-live="polite">
  <div class="loader" aria-hidden="true">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>
  <div>Iniciando sesión...</div>
</div>

<script src="/supabase-local.js"></script>
<script src="/tenant-config.js"></script>
<script>
const SUPABASE_URL = 'https://zkrnjdsnuyjaxxnluzmn.supabase.co'
const SUPABASE_KEY = 'sb_publishable_nde3IHFs-CJqqY0w5gV77g_FbtKtH7z'
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { autoRefreshToken: true, persistSession: true, detectSessionInUrl: true }
})

let redireccionEnCurso = false

function mostrarErrorRedireccion(mensaje, error = null) {
  if (error) {
    console.error('[redirect] No se pudo completar el acceso:', {
      message: error.message,
      code: error.code,
      details: error.details,
      hint: error.hint
    })
  }

  redireccionEnCurso = false
  const estado = document.querySelector('.estado')
  if (!estado) return
  estado.replaceChildren()

  const texto = document.createElement('div')
  texto.textContent = mensaje
  texto.style.maxWidth = '420px'
  texto.style.padding = '0 20px'
  texto.style.textAlign = 'center'
  texto.style.lineHeight = '1.6'
  estado.appendChild(texto)

  const enlace = document.createElement('a')
  enlace.href = '/login.html'
  enlace.textContent = 'Volver al inicio de sesión'
  enlace.style.color = 'white'
  enlace.style.fontWeight = '900'
  estado.appendChild(enlace)
}

async function esperarTenantActual() {
  if (window.tenantConfigReady) {
    return Promise.race([
      window.tenantConfigReady,
      new Promise((_, reject) => setTimeout(
        () => reject(new Error('TENANT_CONFIG_TIMEOUT')),
        12000
      ))
    ])
  }
  if (window.tenantConfig) return window.tenantConfig

  return new Promise((resolve, reject) => {
    const temporizador = setTimeout(
      () => reject(new Error('TENANT_CONFIG_TIMEOUT')),
      12000
    )
    window.addEventListener('tenant-config-aplicada', evento => {
      clearTimeout(temporizador)
      resolve(evento.detail)
    }, { once: true })
  })
}

async function redirigirPorRol(session) {
  if (!session?.user || redireccionEnCurso) return
  redireccionEnCurso = true

  let tenant
  try {
    tenant = await esperarTenantActual()
  } catch (error) {
    mostrarErrorRedireccion(
      'No pudimos identificar la empresa desde la que estás entrando. Revisa la dirección e inténtalo nuevamente.',
      error
    )
    return
  }

  const tenantId = tenant?.id || window.tenantConfig?.id
  if (!tenantId) {
    mostrarErrorRedireccion(
      'No pudimos identificar la empresa desde la que estás entrando. Revisa la dirección e inténtalo nuevamente.'
    )
    return
  }

  let { data: rolData, error } = await db.from('usuario_tenant_roles')
    .select('rol')
    .eq('user_id', session.user.id)
    .eq('tenant_id', tenantId)
    .maybeSingle()

  if (error) {
    mostrarErrorRedireccion(
      'No pudimos verificar tu acceso. Inténtalo nuevamente.',
      error
    )
    return
  }

  if (!rolData) {
    const { error: errorResolver } = await db.rpc(
      'auto_asignar_rol_cliente',
      { p_tenant_id: tenantId }
    )

    if (errorResolver) {
      mostrarErrorRedireccion(
        'No pudimos completar el acceso a esta empresa. Verifica la dirección e inténtalo nuevamente.',
        errorResolver
      )
      return
    }

    const resultadoRol = await db.from('usuario_tenant_roles')
      .select('rol')
      .eq('user_id', session.user.id)
      .eq('tenant_id', tenantId)
      .maybeSingle()

    if (resultadoRol.error || !resultadoRol.data) {
      mostrarErrorRedireccion(
        'Tu acceso no quedó configurado. Inténtalo nuevamente.',
        resultadoRol.error
      )
      return
    }

    rolData = resultadoRol.data
  }
  console.log('[redirect] tenant:', tenantId, 'rol:', rolData?.rol)

  if (tenant?.tipo === 'restaurante' || window.tenantConfig?.tipo === 'restaurante') {
    if (rolData?.rol === 'admin') window.location.replace('/cocina.html')
    else window.location.replace('/menu.html')
  } else if (rolData?.rol === 'admin') {
    window.location.replace('/admin.html')
  } else if (rolData?.rol === 'repartidor') {
    window.location.replace('/repartidor.html')
  } else {
    window.location.replace('/app.html')
  }
}

db.auth.onAuthStateChange(async (evento, session) => {
  console.log('[redirect] evento:', evento, 'correo:', session?.user?.email)
  if (evento === 'SIGNED_IN' && session) {
    await redirigirPorRol(session)
  }
})

async function comprobarSesionInicial() {
  const { data: { session }, error } = await db.auth.getSession()
  if (error) {
    console.warn('[redirect] No fue posible comprobar la sesión inicial:', error.message)
  }
  if (session) {
    await redirigirPorRol(session)
    return
  }

  // Da tiempo al cliente de Supabase para procesar el callback de OAuth.
  await new Promise(resolve => setTimeout(resolve, 1500))
  const { data: { session: sesionReintento } } = await db.auth.getSession()
  if (sesionReintento) {
    await redirigirPorRol(sesionReintento)
    return
  }

  window.location.replace('/login.html')
}

comprobarSesionInicial()
</script>
</body>
</html>
