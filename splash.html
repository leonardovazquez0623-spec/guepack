<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<script>document.documentElement.style.visibility = 'hidden'</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GUEPACK</title>
<link rel="apple-touch-icon" href="/Icono_gp.png">
<meta name="theme-color" content="#1a4fa0">
<link rel="icon" type="image/png" href="/Icono_gp.png">
<script src="/tenant-config.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0e3070;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* ---- Splash actual (paquetería): sin cambios ---- */
  .splash-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    animation: fadeIn 1.4s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes fadeIn {
    0% { opacity: 0; transform: scale(0.3); filter: blur(10px); }
    60% { opacity: 1; transform: scale(1.05); filter: blur(0px); }
    100% { opacity: 1; transform: scale(1); }
  }
  .logo {
    width: 85vw;
    max-width: 420px;
    filter: drop-shadow(0px 6px 16px rgba(0,0,0,0.25)) drop-shadow(0px 2px 6px rgba(240,90,26,0.15));
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-8px); }
  }
  .loader {
    margin-top: 48px;
    display: flex;
    gap: 8px;
  }
  .dot {
    width: 8px;
    height: 8px;
    background: #f05a1a;
    border-radius: 50%;
    animation: bounce 1.2s infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.2s; background: white; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; }
    40% { transform: scale(1); opacity: 1; }
  }

  /* ---- Splash de bienvenida (tenants tipo restaurante) ---- */
  #onboarding-splash {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 32px 24px max(32px, env(safe-area-inset-bottom));
    background: linear-gradient(160deg, var(--color-primary-dark, #172554), var(--color-primary, #1a4fa0));
    text-align: center;
    color: #fff;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    animation: onboardingFadeIn 1s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes onboardingFadeIn {
    0% { opacity: 0; transform: scale(0.92); }
    100% { opacity: 1; transform: scale(1); }
  }
  .onboarding-logo {
    width: 132px;
    height: 132px;
    margin-bottom: 6px;
    padding: 16px;
    border-radius: 32px;
    object-fit: contain;
    background: rgba(255, 255, 255, .97);
    box-shadow: 0 18px 40px rgba(0, 0, 0, .22);
  }
  .onboarding-tagline {
    max-width: 320px;
    margin: 0 0 30px;
    font-size: 17px;
    line-height: 1.5;
    opacity: .92;
  }
  .onboarding-comenzar {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: min(320px, 84vw);
    min-height: 54px;
    border: 0;
    border-radius: 16px;
    color: var(--color-primary-dark, #172554);
    background: #fff;
    box-shadow: 0 14px 30px rgba(0, 0, 0, .2);
    font-size: 16px;
    font-weight: 800;
    text-decoration: none;
  }
  .onboarding-comenzar:active { transform: translateY(1px); }
  .onboarding-login {
    margin-top: 18px;
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    text-decoration: underline;
    text-underline-offset: 3px;
    opacity: .88;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="legacy-splash" class="splash-container">
  <img src="/Splash_icon.png" class="logo" alt="GUEPACK">
  <div class="loader">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>
</div>

<div id="onboarding-splash" hidden>
  <img id="onboarding-logo" class="onboarding-logo" data-tenant-logo src="/logo_principal.png" alt="Logo">
  <p id="onboarding-tagline" class="onboarding-tagline">Tu comida favorita, donde tú estés.</p>
  <a id="onboarding-comenzar" class="onboarding-comenzar" href="menu.html">Comenzar</a>
  <a id="onboarding-login" class="onboarding-login" href="login.html">Iniciar sesión</a>
</div>

<script src="/supabase-local.js"></script>
<script src="/tenant-config.js"></script>
<script>
const SUPABASE_URL = 'https://zkrnjdsnuyjaxxnluzmn.supabase.co'
const SUPABASE_KEY = 'sb_publishable_nde3IHFs-CJqqY0w5gV77g_FbtKtH7z'
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { autoRefreshToken: true, persistSession: true, detectSessionInUrl: true }
})

let esRestaurante = false
let paginaRevelada = false

function revelarPagina() {
  if (paginaRevelada) return
  paginaRevelada = true
  if (window.tenantConfig?.color_primario) {
    document.body.style.backgroundColor = window.tenantConfig.color_primario
  }
  document.documentElement.style.visibility = 'visible'
}

const elementosOnboarding = {
  legacy: document.getElementById('legacy-splash'),
  onboarding: document.getElementById('onboarding-splash'),
  logo: document.getElementById('onboarding-logo'),
  tagline: document.getElementById('onboarding-tagline'),
  comenzar: document.getElementById('onboarding-comenzar'),
  login: document.getElementById('onboarding-login')
}

elementosOnboarding.comenzar.addEventListener('click', evento => {
  evento.preventDefault()
  comenzar()
})

function mostrarOnboardingRestaurante(tenant) {
  esRestaurante = true
  elementosOnboarding.legacy.hidden = true
  elementosOnboarding.onboarding.hidden = false

  const logo = tenant?.logo_url
  if (logo) elementosOnboarding.logo.src = logo
  elementosOnboarding.tagline.textContent =
    tenant?.nombre_app || tenant?.nombre || 'Tu comida favorita, donde tú estés.'

  const destinoMenu = `menu.html${location.search}`
  elementosOnboarding.comenzar.href = destinoMenu
  elementosOnboarding.login.href = `login.html?redirect=${encodeURIComponent(destinoMenu)}`
}

function decidirTipoYRevelar(tenant) {
  if (tenant?.tipo === 'restaurante' && !esRestaurante) mostrarOnboardingRestaurante(tenant)
  revelarPagina()
}

// tenant-config.js puede aplicar el tema de forma síncrona cuando hay caché en
// sessionStorage (antes de que este script llegue a registrar el listener), así
// que cubrimos ambos casos para no revelar la página con el splash equivocado.
if (window.tenantConfig) decidirTipoYRevelar(window.tenantConfig)
else window.addEventListener('tenantLoaded', () => decidirTipoYRevelar(window.tenantConfig), { once: true })
// Red de seguridad: si el tenant nunca termina de cargar, no dejamos la página oculta.
setTimeout(revelarPagina, 4000)

function esperarTenantActual() {
  if (window.tenantConfigReady) {
    return window.tenantConfigReady.then(tenant => tenant || window.tenantConfig)
  }
  if (window.tenantConfig) return Promise.resolve(window.tenantConfig)

  return new Promise(resolve => {
    window.addEventListener('tenantLoaded', () => resolve(window.tenantConfig), { once: true })
  })
}

// La detección del tenant debe terminar antes de consultar el rol del usuario.
const promesaTenant = esperarTenantActual()
promesaTenant.then(decidirTipoYRevelar)

setTimeout(() => {
  if (esRestaurante) return
  if (window.location.pathname === '/splash.html' || window.location.href.includes('splash')) {
    console.log('[splash] tiempo agotado; se forzará la redirección al inicio de sesión')
    window.location.href = 'login.html'
  }
}, 5000)

async function decidirRolYRedirigir(session, { mantenerOnboardingRestaurante = false } = {}) {
  const tenant = await promesaTenant
  const tenantId = tenant?.id || window.tenantConfig?.id || 1
  const esTenantRestaurante = tenant?.tipo === 'restaurante' || window.tenantConfig?.tipo === 'restaurante'
  let { data: rolData, error } = await db.from('usuario_tenant_roles')
    .select('rol')
    .eq('user_id', session.user.id)
    .eq('tenant_id', tenantId)
    .maybeSingle()

  if (error) {
    console.warn('[auth] No fue posible consultar el rol del tenant:', error.message)
  }

  const { data: usuarioData, error: errorSuperadmin } = await db.from('usuarios')
    .select('es_superadmin')
    .eq('user_id', session.user.id)
    .maybeSingle()
  if (errorSuperadmin) {
    console.warn('[auth] No fue posible comprobar si el usuario es superadmin:', errorSuperadmin.message)
  }

  const esAdmin = rolData?.rol === 'admin'
  const esSuperadmin = usuarioData?.es_superadmin === true

  if (!rolData && !esSuperadmin) {
    const { error: errorCrearRol } = await db.from('usuario_tenant_roles').insert({
      user_id: session.user.id,
      tenant_id: tenantId,
      rol: 'cliente'
    })
    if (errorCrearRol && errorCrearRol.code !== '23505') {
      console.error('[auth] No fue posible crear el rol cliente del tenant:', errorCrearRol)
    }
    rolData = { rol: 'cliente' }
  }

  if (esAdmin || esSuperadmin) {
    window.location.replace(esTenantRestaurante ? 'cocina.html' : 'admin.html')
  } else if (esTenantRestaurante) {
    if (mantenerOnboardingRestaurante) return
    window.location.href = `menu.html${location.search}`
  } else if (rolData?.rol === 'repartidor') {
    window.location.href = 'repartidor.html'
  } else {
    window.location.href = 'app.html'
  }
}

async function comenzar() {
  const { data: { session }, error } = await db.auth.getSession()
  if (error) {
    console.warn('[auth] No fue posible comprobar la sesión al comenzar:', error.message)
  }

  if (session) {
    await decidirRolYRedirigir(session)
  } else {
    window.location.href = `menu.html${location.search}`
  }
}

async function init() {
  const promesaEsperaSplash = new Promise(resolve => setTimeout(resolve, 2000))
  let session = null

  // Primer intento con la sesión que ya pudiera estar almacenada.
  const { data: { session: sesionInmediata }, error: errorSesion } = await db.auth.getSession()
  if (errorSesion) {
    console.warn('[auth] No fue posible comprobar la sesión inmediata:', errorSesion.message)
  }
  session = sesionInmediata

  // Si el callback OAuth sigue procesándose, espera SIGNED_IN durante un máximo de dos segundos.
  if (!session) {
    let suscripcionAuth = null
    await new Promise(resolve => {
      const finalizarEspera = () => {
        suscripcionAuth?.unsubscribe()
        resolve()
      }
      const temporizador = setTimeout(finalizarEspera, 2000)
      const { data } = db.auth.onAuthStateChange((evento, nuevaSesion) => {
        console.log('[auth] evento en splash:', evento, 'sesión:', nuevaSesion?.user?.email)
        if (evento === 'SIGNED_IN' && nuevaSesion) {
          session = nuevaSesion
          clearTimeout(temporizador)
          finalizarEspera()
        }
      })
      suscripcionAuth = data.subscription
    })
  }

  await promesaEsperaSplash

  if (session) {
    await decidirRolYRedirigir(session, { mantenerOnboardingRestaurante: true })
    return
  }

  try {
    const tenant = await promesaTenant
    if (tenant?.tipo === 'restaurante') return
    const slug = String(tenant?.slug || '').toLowerCase()
    const plan = String(tenant?.plan || '').toLowerCase()

    if (slug === 'guepack') {
      window.location.href = 'landing.html.html'
    } else if (plan === 'basico') {
      window.location.href = 'login.html'
    } else {
      window.location.href = 'landing-tenant.html'
    }
  } catch (error) {
    console.error('[splash] error al detectar el tenant:', error)
    window.location.href = 'login.html'
  }
}
init()
</script>
</body>
</html>
