<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cocina</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" href="/Icono_gp.png">
<meta name="theme-color" content="#0d3a8a">
<link rel="icon" type="image/png" href="/Icono_gp.png">
<script src="/tenant-config.js"></script>
<style>
  :root {
    --color-primary: #1E56C7;
    --color-secondary: #F05A1A;
    --color-primary-dark: #0d3a8a;
    --color-primary-light: #e8f0fe;
    --color-secondary-dark: #c4440e;
    --color-secondary-light: #fff0eb;
    --blue: var(--color-primary-dark);
    --blue-dark: #0e3070;
    --blue-light: #2563c4;
    --orange: var(--color-secondary);
    --orange-light: #ff7a3d;
    --white: #ffffff;
    --gray-light: #f4f6fb;
    --gray: #e0e6f0;
    --gray-mid: #8fa3c0;
    --text: var(--color-primary-dark);
    --success: #22c55e;
    --danger: #ef4444;
    --shadow: 0 4px 24px rgba(26,79,160,0.13);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Montserrat', sans-serif; background: var(--gray-light); color: var(--text); min-height: 100vh; }
  button, input, select, textarea { font: inherit; }
  button { cursor: pointer; }

  .app-header {
    background: linear-gradient(135deg, var(--blue-dark) 0%, var(--blue) 60%, var(--blue-light) 100%);
    padding: 18px 20px 22px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }
  .header-brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .header-logo { width: 46px; height: 46px; border-radius: 12px; object-fit: contain; background: #fff; padding: 5px; flex: 0 0 auto; }
  .header-branch { font-family: 'Bebas Neue', sans-serif; color: white; font-size: 24px; letter-spacing: 1px; line-height: 1.1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .header-sub { color: rgba(255,255,255,0.68); font-size: 10.5px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
  .btn-logout { background: rgba(255,255,255,0.15); border: none; color: white; font-weight: 700; font-size: 11px; padding: 8px 14px; border-radius: 8px; cursor: pointer; letter-spacing: .5px; white-space: nowrap; }
  .btn-logout:hover { background: var(--orange); }

  .sound-banner {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    background: #fef3c7; color: #92400e; font-weight: 800; font-size: 12.5px;
    padding: 10px 16px; text-align: center; cursor: pointer;
  }
  .sound-banner[hidden] { display: none; }

  .tabs { display: flex; gap: 4px; background: white; padding: 4px; margin: 14px 16px 0; border-radius: 12px; box-shadow: var(--shadow); max-width: 420px; }
  .tab { flex: 1; padding: 10px 8px; text-align: center; border: none; border-radius: 8px; background: transparent; color: var(--gray-mid); font-weight: 900; font-size: 11.5px; letter-spacing: .4px; }
  .tab.active { background: rgba(26,79,160,0.08); color: var(--blue); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* ---- Kanban ---- */
  .kanban-scroll { display: flex; gap: 14px; overflow-x: auto; padding: 16px; scroll-snap-type: x proximity; }
  .kanban-column {
    flex: 0 0 300px;
    scroll-snap-align: start;
    background: white;
    border-radius: 16px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    max-height: calc(100vh - 210px);
  }
  .kanban-column-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; border-bottom: 2px solid var(--gray-light);
  }
  .kanban-title { font-size: 12.5px; font-weight: 900; letter-spacing: .5px; }
  .kanban-count { background: var(--gray-light); color: var(--blue); font-size: 11px; font-weight: 900; padding: 2px 9px; border-radius: 20px; }
  .kanban-cards { padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; flex: 1; }

  .order-card { background: var(--gray-light); border-radius: 14px; padding: 14px; border-left: 4px solid var(--blue); }
  .order-card.urgent { border-left-color: var(--danger); }
  .order-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .order-folio { font-family: 'Bebas Neue', sans-serif; font-size: 18px; color: var(--blue); letter-spacing: .5px; }
  .order-elapsed { font-size: 10.5px; font-weight: 800; color: var(--gray-mid); background: white; padding: 3px 8px; border-radius: 20px; }
  .order-elapsed.late { color: var(--danger); background: #fef2f2; }
  .order-items { list-style: none; margin: 0 0 10px; padding: 0; font-size: 12px; font-weight: 700; color: var(--text); }
  .order-items li { padding: 2px 0; }
  .order-items li span { color: var(--gray-mid); font-weight: 600; }
  .order-meta { font-size: 10.5px; color: var(--gray-mid); font-weight: 700; margin-bottom: 3px; display: flex; gap: 5px; align-items: flex-start; }
  .order-repa { font-size: 11px; font-weight: 800; color: var(--success); margin-top: 6px; }
  .order-action { width: 100%; margin-top: 10px; padding: 10px 12px; border: none; border-radius: 10px; font-weight: 900; font-size: 11.5px; color: white; letter-spacing: .3px; }
  .order-action.nuevo { background: var(--blue); }
  .order-action.preparacion { background: var(--orange); }
  .order-action.listo { background: var(--success); }
  .empty-column { padding: 30px 14px; text-align: center; color: var(--gray-mid); font-size: 12px; font-weight: 700; }

  /* ---- Menú ---- */
  .container { padding: 16px; max-width: 640px; margin: 0 auto; }
  .card { background: white; border-radius: 16px; padding: 18px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .card-title { font-size: 11px; font-weight: 900; letter-spacing: 1.5px; text-transform: uppercase; color: var(--blue); margin-bottom: 4px; }
  .cat-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-bottom: 10px; margin-bottom: 10px; border-bottom: 2px solid var(--gray-light); }
  .cat-name { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: .5px; color: var(--text); }

  .toggle-wrap { display: flex; align-items: center; gap: 10px; }
  .toggle { position: relative; display: inline-block; width: 42px; height: 24px; flex: 0 0 auto; }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .toggle-slider { position: absolute; inset: 0; background: #ccc; border-radius: 26px; cursor: pointer; transition: .2s; }
  .toggle-slider::before { content: ''; position: absolute; width: 18px; height: 18px; left: 3px; bottom: 3px; background: white; border-radius: 50%; transition: .2s; box-shadow: 0 1px 4px rgba(0,0,0,.2); }
  .toggle input:checked + .toggle-slider { background: var(--success); }
  .toggle input:checked + .toggle-slider::before { transform: translateX(18px); }

  .prod-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--gray-light); }
  .prod-row:last-child { border-bottom: none; }
  .prod-thumb { width: 50px; height: 50px; border-radius: 10px; object-fit: cover; background: var(--gray-light); flex: 0 0 auto; }
  .prod-thumb.placeholder { display: grid; place-items: center; font-size: 20px; }
  .prod-info { flex: 1; min-width: 0; }
  .prod-name { font-size: 13.5px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .prod-price { font-size: 12.5px; font-weight: 900; color: var(--blue); }
  .prod-price-edit { display: none; align-items: center; gap: 5px; margin-top: 3px; }
  .prod-price-edit.editing { display: flex; }
  .prod-price-edit input { width: 84px; padding: 5px 7px; border: 2px solid var(--gray); border-radius: 7px; font-size: 12px; font-weight: 700; }
  .prod-price-edit button { border: none; border-radius: 7px; padding: 5px 9px; font-size: 10px; font-weight: 900; }
  .prod-actions { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }
  .icon-btn { border: none; background: var(--gray-light); border-radius: 9px; width: 30px; height: 30px; font-size: 13px; }
  .empty-state { text-align: center; padding: 34px 20px; color: var(--gray-mid); }
  .empty-state .empty-icon { font-size: 36px; display: block; margin-bottom: 8px; }

  .btn { padding: 11px 16px; border: none; border-radius: 10px; font-weight: 900; font-size: 12.5px; }
  .btn-primary { background: var(--blue); color: white; width: 100%; }
  .btn-secondary { background: var(--gray-light); color: var(--blue); }

  /* ---- Modales ---- */
  .modal-fondo { position: fixed; inset: 0; background: rgba(13,58,138,.55); z-index: 999; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .modal { background: white; border-radius: 20px; padding: 22px; width: 100%; max-width: 380px; max-height: 88vh; overflow-y: auto; }
  .modal-titulo { font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: var(--blue); letter-spacing: 1px; margin-bottom: 16px; }
  .form-group { margin-bottom: 13px; }
  .form-label { display: block; font-size: 10.5px; font-weight: 800; color: var(--gray-mid); letter-spacing: .5px; text-transform: uppercase; margin-bottom: 6px; }
  .form-input { width: 100%; padding: 11px 13px; border: 2px solid var(--gray); border-radius: 10px; font-size: 13px; font-weight: 600; color: var(--text); background: var(--gray-light); }
  .form-input:focus { outline: none; border-color: var(--blue); background: white; }
  .modal-actions { display: flex; gap: 10px; margin-top: 16px; }
  .modal-actions .btn { flex: 1; }
  .repa-option { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border: 2px solid var(--gray); border-radius: 12px; margin-bottom: 8px; cursor: pointer; font-weight: 700; font-size: 13px; }
  .repa-option:hover { border-color: var(--blue); background: var(--color-primary-light); }

  #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--color-primary-dark); color: #fff; padding: 12px 22px; border-radius: 12px; font-size: 13px; font-weight: 700; z-index: 99999; transition: transform .3s; white-space: nowrap; box-shadow: 0 4px 20px rgba(0,0,0,0.3); pointer-events: none; }
  #toast.show { transform: translateX(-50%) translateY(0); }
  #toast.error { background: var(--danger); }

  #cargando { position: fixed; inset: 0; background: var(--gray-light); z-index: 9999; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px; }
  #cargando img { width: 64px; height: 64px; animation: girar 1.1s linear infinite; }
  @keyframes girar { to { transform: rotate(360deg); } }

  @media (min-width: 700px) {
    .container { max-width: 900px; }
  }
</style>
</head>
<body>

<div id="cargando">
  <img src="/Icono_gp.png" alt="">
  <div style="font-weight:800;color:var(--blue);font-size:13px">Cargando cocina…</div>
</div>

<div id="sound-banner" class="sound-banner" hidden>🔔 Toca aquí para activar el sonido de alertas de nuevos pedidos</div>

<div class="app-header">
  <div class="header-brand">
    <img id="header-logo" class="header-logo" data-tenant-logo src="/logo_principal.png" alt="Logo">
    <div style="min-width:0">
      <div id="header-branch" class="header-branch">Cargando…</div>
      <div class="header-sub">Panel de cocina</div>
    </div>
  </div>
  <button class="btn-logout" onclick="cerrarSesion()">🚪 Salir</button>
</div>

<div class="tabs">
  <button class="tab active" id="tab-btn-pedidos" onclick="cambiarTab('pedidos')">📥 Pedidos</button>
  <button class="tab" id="tab-btn-menu" onclick="cambiarTab('menu')">🍽️ Menú</button>
</div>

<div id="tab-pedidos" class="tab-panel active">
  <div class="kanban-scroll">
    <div class="kanban-column">
      <div class="kanban-column-header"><span class="kanban-title">📥 NUEVOS</span><span class="kanban-count" id="count-nuevos">0</span></div>
      <div class="kanban-cards" id="col-nuevos"></div>
    </div>
    <div class="kanban-column">
      <div class="kanban-column-header"><span class="kanban-title">🍳 EN PREPARACIÓN</span><span class="kanban-count" id="count-preparacion">0</span></div>
      <div class="kanban-cards" id="col-preparacion"></div>
    </div>
    <div class="kanban-column">
      <div class="kanban-column-header"><span class="kanban-title">✅ LISTOS</span><span class="kanban-count" id="count-listos">0</span></div>
      <div class="kanban-cards" id="col-listos"></div>
    </div>
    <div class="kanban-column">
      <div class="kanban-column-header"><span class="kanban-title">🛵 EN CAMINO</span><span class="kanban-count" id="count-camino">0</span></div>
      <div class="kanban-cards" id="col-camino"></div>
    </div>
  </div>
</div>

<div id="tab-menu" class="tab-panel">
  <div class="container">
    <button class="btn btn-primary" style="margin-bottom:14px" onclick="abrirModalProducto()">+ Agregar producto</button>
    <div id="menu-lista"><div class="empty-state">Cargando menú…</div></div>
  </div>
</div>

<div id="toast"></div>

<script src="/supabase-local.js"></script>
<script>
const SUPABASE_URL = 'https://zkrnjdsnuyjaxxnluzmn.supabase.co'
const SUPABASE_KEY = 'sb_publishable_nde3IHFs-CJqqY0w5gV77g_FbtKtH7z'
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { autoRefreshToken: true, persistSession: true, detectSessionInUrl: false },
  global: { fetch: (url, options = {}) => fetch(url, { ...options, cache: 'no-store' }) }
})

const PARAMETROS = new URLSearchParams(location.search)
const SUCURSAL_ID = PARAMETROS.get('sucursal') || '1'
let TENANT_ID = null
let sucursalActual = null
let pedidosCocina = []
let itemsPorPedido = {}
let categorias = []
let productos = []
let realtimeChannel = null
let cargandoPedidos = false
let temporizadorToast = null

const ESTADOS_EXCLUIDOS = ['Cancelado', 'Pago rechazado', 'Entregado', 'Pendiente verificación de pago']

function escaparHtml(valor) {
  return String(valor ?? '').replace(/[&<>"']/g, caracter => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
  })[caracter])
}
function escaparAtributo(valor) {
  return escaparHtml(valor).replace(/`/g, '&#096;')
}
function moneda(valor) {
  return new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' }).format(Number(valor) || 0)
}

function mostrarToast(mensaje, error = false) {
  const toast = document.getElementById('toast')
  toast.textContent = mensaje
  toast.classList.toggle('error', error)
  toast.classList.add('show')
  clearTimeout(temporizadorToast)
  temporizadorToast = setTimeout(() => toast.classList.remove('show'), 3500)
}

function cambiarTab(tab) {
  document.querySelectorAll('.tab-panel').forEach(el => el.classList.remove('active'))
  document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'))
  document.getElementById('tab-' + tab).classList.add('active')
  document.getElementById('tab-btn-' + tab).classList.add('active')
  if (tab === 'menu' && !categorias.length && !productos.length) cargarMenuCocina()
}

async function cerrarSesion() {
  await db.auth.signOut()
  window.location.href = 'login.html'
}

/* ================= Autenticación ================= */

async function iniciarPanel() {
  let { data: { session } } = await db.auth.getSession()
  if (!session) {
    const { data } = await db.auth.refreshSession()
    session = data?.session
  }
  if (!session) { window.location.href = 'login.html'; return }

  const { data: usuarioData, error: errorUsuario } = await db.from('usuarios')
    .select('tenant_id')
    .eq('user_id', session.user.id)
    .single()
  if (errorUsuario) console.error('[cocina] No fue posible obtener el usuario:', errorUsuario)

  const tenant = await (window.tenantConfigReady || Promise.resolve(window.tenantConfig))
  TENANT_ID = tenant?.id || window.tenantConfig?.id || usuarioData?.tenant_id || 1

  const { data: rolTenant, error: errorRol } = await db.from('usuario_tenant_roles')
    .select('rol')
    .eq('user_id', session.user.id)
    .eq('tenant_id', TENANT_ID)
    .maybeSingle()
  if (errorRol) console.error('[cocina] No fue posible verificar el rol:', errorRol)

  if (rolTenant?.rol !== 'admin') { window.location.href = 'login.html'; return }

  const { data: sucursal, error: errorSucursal } = await db.from('sucursales')
    .select('*')
    .eq('tenant_id', TENANT_ID)
    .eq('id', SUCURSAL_ID)
    .maybeSingle()
  if (errorSucursal) console.error('[cocina] No fue posible cargar la sucursal:', errorSucursal)
  sucursalActual = sucursal
  document.getElementById('header-branch').textContent = sucursal?.nombre || `Sucursal ${SUCURSAL_ID}`

  document.getElementById('cargando').style.display = 'none'
  instalarSonido()
  await cargarPedidosCocina()
  iniciarRealtime()
  setInterval(cargarPedidosCocina, 45000)
  setInterval(actualizarTiemposTranscurridos, 30000)
}

/* ================= Sonido de alerta ================= */

const notiAudio = new Audio('/noti_repa.mp3')
notiAudio.preload = 'auto'
let sonidoActivado = false

function instalarSonido() {
  const banner = document.getElementById('sound-banner')
  banner.hidden = false
  banner.addEventListener('click', () => {
    notiAudio.play().then(() => {
      notiAudio.pause()
      notiAudio.currentTime = 0
      sonidoActivado = true
      banner.hidden = true
    }).catch(error => console.warn('[cocina] audio bloqueado:', error))
  })
}

function sonarAlerta() {
  if (!sonidoActivado) return
  notiAudio.currentTime = 0
  notiAudio.play().catch(error => console.warn('[cocina] audio:', error))
  if (navigator.vibrate) navigator.vibrate([60, 40, 120])
}

/* ================= Pedidos (Kanban) ================= */

function tiempoTranscurrido(fechaIso) {
  const inicio = new Date(fechaIso).getTime()
  if (!Number.isFinite(inicio)) return { texto: '—', minutos: 0 }
  const minutos = Math.max(0, Math.floor((Date.now() - inicio) / 60000))
  if (minutos < 1) return { texto: 'Recién llegó', minutos }
  if (minutos < 60) return { texto: `${minutos} min`, minutos }
  const horas = Math.floor(minutos / 60)
  const resto = minutos % 60
  return { texto: `${horas} h ${resto} min`, minutos }
}

function actualizarTiemposTranscurridos() {
  document.querySelectorAll('[data-elapsed-for]').forEach(elemento => {
    const pedido = pedidosCocina.find(p => String(p.id) === elemento.dataset.elapsedFor)
    if (!pedido) return
    const { texto, minutos } = tiempoTranscurrido(pedido.created_at)
    elemento.textContent = texto
    elemento.classList.toggle('late', minutos >= 20)
  })
}

async function cargarPedidosCocina() {
  if (cargandoPedidos || !TENANT_ID) return
  cargandoPedidos = true
  try {
    const desde = new Date(Date.now() - 2 * 24 * 60 * 60 * 1000).toISOString()
    const { data, error } = await db.from('pedidos')
      .select('*')
      .eq('tenant_id', TENANT_ID)
      .eq('sucursal_id', SUCURSAL_ID)
      .gte('created_at', desde)
      .order('created_at', { ascending: true })
    if (error) { console.error('[cocina] Error al cargar pedidos:', error); return }

    const previos = new Set(pedidosCocina.map(p => p.id))
    pedidosCocina = (data || []).filter(p => !ESTADOS_EXCLUIDOS.includes(p.estado))

    const nuevosIds = pedidosCocina.filter(p => !previos.has(p.id))
    if (previos.size && nuevosIds.length) sonarAlerta()

    const ids = pedidosCocina.map(p => p.id)
    itemsPorPedido = {}
    if (ids.length) {
      const { data: items, error: errorItems } = await db.from('pedido_items')
        .select('pedido_id, nombre_producto, cantidad, notas')
        .in('pedido_id', ids)
      if (errorItems) console.error('[cocina] Error al cargar items:', errorItems)
      ;(items || []).forEach(item => {
        if (!itemsPorPedido[item.pedido_id]) itemsPorPedido[item.pedido_id] = []
        itemsPorPedido[item.pedido_id].push(item)
      })
    }

    renderizarKanban()
  } finally {
    cargandoPedidos = false
  }
}

function renderizarKanban() {
  const columnas = {
    nuevos: pedidosCocina.filter(p => !p.estado_cocina || p.estado_cocina === 'nuevo'),
    preparacion: pedidosCocina.filter(p => p.estado_cocina === 'en_preparacion'),
    listos: pedidosCocina.filter(p => p.estado_cocina === 'listo'),
    camino: pedidosCocina.filter(p => p.estado_cocina === 'en_camino')
  }
  Object.entries(columnas).forEach(([clave, lista]) => {
    document.getElementById('count-' + clave).textContent = String(lista.length)
    const contenedor = document.getElementById('col-' + clave)
    if (!lista.length) {
      contenedor.innerHTML = '<div class="empty-column">Sin pedidos</div>'
      return
    }
    contenedor.innerHTML = lista.map(pedido => renderizarCard(pedido, clave)).join('')
  })
}

function renderizarCard(pedido, columna) {
  const { texto, minutos } = tiempoTranscurrido(pedido.created_at)
  const items = itemsPorPedido[pedido.id] || []
  const listaItems = items.length
    ? items.map(item => `<li>${Number(item.cantidad) || 1}x ${escaparHtml(item.nombre_producto)}${item.notas ? ` <span>· ${escaparHtml(item.notas)}</span>` : ''}</li>`).join('')
    : '<li><span>Sin detalle de productos</span></li>'

  let boton = ''
  if (columna === 'nuevos') {
    boton = `<button class="order-action nuevo" onclick="aceptarPedido(${pedido.id})">✅ Aceptar pedido</button>`
  } else if (columna === 'preparacion') {
    boton = `<button class="order-action preparacion" onclick="marcarListo(${pedido.id})">📦 Listo para entregar</button>`
  } else if (columna === 'listos') {
    boton = `<button class="order-action listo" onclick="abrirAsignarRepartidor(${pedido.id})">🛵 Asignar repartidor</button>`
  }

  return `
    <article class="order-card${minutos >= 20 ? ' urgent' : ''}">
      <div class="order-top">
        <span class="order-folio">GK-${pedido.id}</span>
        <span class="order-elapsed${minutos >= 20 ? ' late' : ''}" data-elapsed-for="${pedido.id}">${texto}</span>
      </div>
      <ul class="order-items">${listaItems}</ul>
      <div class="order-meta">📍 ${escaparHtml(pedido.direccion_entrega) || 'Sin dirección'}</div>
      <div class="order-meta">💳 ${escaparHtml(pedido.metodo_pago) || 'N/D'}</div>
      ${pedido.repartidor ? `<div class="order-repa">🏍️ ${escaparHtml(pedido.repartidor)}</div>` : ''}
      ${boton}
    </article>`
}

async function aceptarPedido(id) {
  const { error } = await db.from('pedidos').update({ estado_cocina: 'en_preparacion' }).eq('id', id).eq('tenant_id', TENANT_ID)
  if (error) { mostrarToast('No se pudo aceptar el pedido', true); return }
  mostrarToast(`Pedido GK-${id} en preparación`)
  cargarPedidosCocina()
}

async function marcarListo(id) {
  const { error } = await db.from('pedidos').update({ estado_cocina: 'listo' }).eq('id', id).eq('tenant_id', TENANT_ID)
  if (error) { mostrarToast('No se pudo marcar como listo', true); return }
  mostrarToast(`Pedido GK-${id} listo para entregar`)
  cargarPedidosCocina()
}

async function abrirAsignarRepartidor(pedidoId) {
  const { data: repartidores, error } = await db.from('repartidores')
    .select('*')
    .eq('tenant_id', TENANT_ID)
    .eq('disponible', true)
    .order('nombre')
  if (error) { mostrarToast('No se pudieron cargar los repartidores', true); return }

  const opciones = (repartidores || []).map(repa =>
    `<div class="repa-option" onclick="confirmarAsignarRepartidor(${pedidoId}, '${escaparAtributo(repa.nombre)}')">
      <span>🏍️ ${escaparHtml(repa.nombre)}</span><span>›</span>
    </div>`
  ).join('') || '<div class="empty-state">No hay repartidores disponibles</div>'

  const fondo = document.createElement('div')
  fondo.id = 'modal-asignar-repa'
  fondo.className = 'modal-fondo'
  fondo.innerHTML = `
    <div class="modal">
      <div class="modal-titulo">Asignar repartidor</div>
      <div>${opciones}</div>
      <div class="modal-actions"><button class="btn btn-secondary" style="flex:1" onclick="document.getElementById('modal-asignar-repa').remove()">Cancelar</button></div>
    </div>`
  fondo.addEventListener('click', evento => { if (evento.target === fondo) fondo.remove() })
  document.body.appendChild(fondo)
}

async function confirmarAsignarRepartidor(pedidoId, nombreRepartidor) {
  const [{ data: repaData }, { data: pedidoData }] = await Promise.all([
    db.from('repartidores').select('ganancia_base, ganancia_por_km, ganancia_tarifa_diaria').eq('nombre', nombreRepartidor).eq('tenant_id', TENANT_ID).single(),
    db.from('pedidos').select('km_recorridos, zona, precio').eq('id', pedidoId).single()
  ])

  const kmPedido = Number(pedidoData?.km_recorridos) || 0
  const esTarifaDiaria = (pedidoData?.zona || '').includes('Tarifa diaria')
  const gananciaBase = Number(repaData?.ganancia_base) || 20
  const gananciaPorKm = Number(repaData?.ganancia_por_km) || 5
  const gananciaDiariaPct = Number(repaData?.ganancia_tarifa_diaria) || 40
  const gananciaCalculada = esTarifaDiaria
    ? Math.round(Number(pedidoData?.precio || 0) * gananciaDiariaPct / 100)
    : Math.round(gananciaBase + (kmPedido * gananciaPorKm))

  const { error } = await db.from('pedidos').update({
    estado: 'En camino a recoleccion',
    estado_cocina: 'en_camino',
    repartidor: nombreRepartidor,
    ganancia_repartidor: gananciaCalculada
  }).eq('id', pedidoId).eq('tenant_id', TENANT_ID)

  document.getElementById('modal-asignar-repa')?.remove()
  if (error) { mostrarToast('No se pudo asignar el repartidor', true); return }
  mostrarToast(`${nombreRepartidor} asignado al pedido GK-${pedidoId}`)
  cargarPedidosCocina()
}

function iniciarRealtime() {
  if (realtimeChannel) db.removeChannel(realtimeChannel)
  realtimeChannel = db.channel('cocina-pedidos-' + TENANT_ID)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'pedidos', filter: 'tenant_id=eq.' + TENANT_ID }, () => cargarPedidosCocina())
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'pedidos', filter: 'tenant_id=eq.' + TENANT_ID }, () => cargarPedidosCocina())
    .subscribe()
}

/* ================= Menú ================= */

async function cargarMenuCocina() {
  const [{ data: cats, error: errorCats }, { data: prods, error: errorProds }] = await Promise.all([
    db.from('menu_categorias').select('*').eq('tenant_id', TENANT_ID).order('orden', { ascending: true }),
    db.from('menu_productos').select('*').eq('tenant_id', TENANT_ID).eq('sucursal_id', SUCURSAL_ID).order('orden', { ascending: true })
  ])
  if (errorCats) console.error('[cocina] Error al cargar categorías:', errorCats)
  if (errorProds) console.error('[cocina] Error al cargar productos:', errorProds)
  categorias = cats || []
  productos = prods || []
  renderizarMenuCocina()
}

function renderizarMenuCocina() {
  const contenedor = document.getElementById('menu-lista')
  if (!categorias.length && !productos.length) {
    contenedor.innerHTML = '<div class="empty-state"><span class="empty-icon">🍽️</span>Aún no hay categorías ni productos.<br>Empieza agregando un producto.</div>'
    return
  }

  const idsCategorias = new Set(categorias.map(categoria => categoria.id))
  const huerfanos = productos.some(producto => !idsCategorias.has(producto.categoria_id ?? null))
  const grupos = categorias.length
    ? (huerfanos ? [...categorias, { id: null, nombre: 'Sin categoría', activa: true }] : categorias)
    : [{ id: null, nombre: 'Sin categoría', activa: true }]

  contenedor.innerHTML = grupos.map(categoria => {
    const productosCategoria = categoria.id == null
      ? productos.filter(producto => !idsCategorias.has(producto.categoria_id ?? null))
      : productos.filter(producto => producto.categoria_id === categoria.id)
    if (!productosCategoria.length && categoria.id == null) return ''
    return `
      <div class="card">
        <div class="cat-header">
          <span class="cat-name">${escaparHtml(categoria.nombre)}</span>
          ${categoria.id != null ? `
            <label class="toggle">
              <input type="checkbox" ${categoria.activa !== false ? 'checked' : ''} onchange="toggleCategoria(${categoria.id}, this.checked)">
              <span class="toggle-slider"></span>
            </label>` : ''}
        </div>
        ${productosCategoria.length
          ? productosCategoria.map(producto => renderizarFilaProducto(producto)).join('')
          : '<div class="empty-state" style="padding:16px">Sin productos en esta categoría</div>'}
      </div>`
  }).join('')
}

function renderizarFilaProducto(producto) {
  const imagen = producto.imagen_url
    ? `<img class="prod-thumb" src="${escaparAtributo(producto.imagen_url)}" alt="">`
    : `<div class="prod-thumb placeholder">🍽️</div>`
  return `
    <div class="prod-row" id="prod-row-${producto.id}">
      ${imagen}
      <div class="prod-info">
        <div class="prod-name">${escaparHtml(producto.nombre)}</div>
        <div class="prod-price" id="prod-price-${producto.id}">${moneda(producto.precio)}</div>
        <div class="prod-price-edit" id="prod-price-edit-${producto.id}">
          <input type="number" min="0" step="0.01" id="prod-price-input-${producto.id}" value="${Number(producto.precio) || 0}">
          <button class="btn-secondary" onclick="guardarPrecioProducto(${producto.id})">Guardar</button>
          <button class="btn-secondary" onclick="cancelarEdicionPrecio(${producto.id})">✕</button>
        </div>
      </div>
      <div class="prod-actions">
        <button class="icon-btn" onclick="editarPrecioProducto(${producto.id})">✏️</button>
        <label class="toggle">
          <input type="checkbox" ${producto.disponible !== false ? 'checked' : ''} onchange="toggleDisponible(${producto.id}, this.checked)">
          <span class="toggle-slider"></span>
        </label>
      </div>
    </div>`
}

async function toggleCategoria(id, activa) {
  const { error } = await db.from('menu_categorias').update({ activa }).eq('id', id).eq('tenant_id', TENANT_ID)
  if (error) { mostrarToast('No se pudo actualizar la categoría', true); return }
  const categoria = categorias.find(c => c.id === id)
  if (categoria) categoria.activa = activa
  mostrarToast(activa ? 'Categoría activada' : 'Categoría desactivada')
}

async function toggleDisponible(id, disponible) {
  const { error } = await db.from('menu_productos').update({ disponible }).eq('id', id).eq('tenant_id', TENANT_ID)
  if (error) { mostrarToast('No se pudo actualizar el producto', true); return }
  const producto = productos.find(p => p.id === id)
  if (producto) producto.disponible = disponible
  mostrarToast(disponible ? 'Producto disponible' : 'Producto marcado como no disponible')
}

function editarPrecioProducto(id) {
  document.getElementById('prod-price-edit-' + id).classList.add('editing')
}
function cancelarEdicionPrecio(id) {
  document.getElementById('prod-price-edit-' + id).classList.remove('editing')
}
async function guardarPrecioProducto(id) {
  const input = document.getElementById('prod-price-input-' + id)
  const precio = Number(input.value)
  if (!Number.isFinite(precio) || precio < 0) { mostrarToast('Precio inválido', true); return }
  const { error } = await db.from('menu_productos').update({ precio }).eq('id', id).eq('tenant_id', TENANT_ID)
  if (error) { mostrarToast('No se pudo actualizar el precio', true); return }
  const producto = productos.find(p => p.id === id)
  if (producto) producto.precio = precio
  document.getElementById('prod-price-' + id).textContent = moneda(precio)
  cancelarEdicionPrecio(id)
  mostrarToast('Precio actualizado')
}

let archivoProductoSeleccionado = null

function abrirModalProducto() {
  archivoProductoSeleccionado = null
  const opcionesCategoria = categorias.map(categoria =>
    `<option value="${categoria.id}">${escaparHtml(categoria.nombre)}</option>`
  ).join('')

  const fondo = document.createElement('div')
  fondo.id = 'modal-producto'
  fondo.className = 'modal-fondo'
  fondo.innerHTML = `
    <div class="modal">
      <div class="modal-titulo">Agregar producto</div>
      <form id="form-producto">
        <div class="form-group"><label class="form-label">Nombre *</label><input class="form-input" id="prod-nombre" required maxlength="120"></div>
        <div class="form-group"><label class="form-label">Descripción</label><input class="form-input" id="prod-descripcion" maxlength="300"></div>
        <div class="form-group"><label class="form-label">Precio *</label><input class="form-input" type="number" id="prod-precio" min="0" step="0.01" required></div>
        <div class="form-group">
          <label class="form-label">Categoría</label>
          <select class="form-input" id="prod-categoria">${opcionesCategoria || '<option value="">Sin categorías</option>'}</select>
        </div>
        <div class="form-group">
          <label class="form-label">Foto</label>
          <input type="file" id="prod-foto" accept="image/*" hidden>
          <button type="button" class="btn btn-secondary" style="width:100%" onclick="document.getElementById('prod-foto').click()">📷 Subir foto</button>
          <div id="prod-foto-nombre" style="font-size:11px;color:var(--gray-mid);font-weight:700;margin-top:6px">Ningún archivo seleccionado</div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" onclick="document.getElementById('modal-producto').remove()">Cancelar</button>
          <button type="submit" class="btn btn-primary" id="btn-guardar-producto">Guardar</button>
        </div>
      </form>
    </div>`
  fondo.addEventListener('click', evento => { if (evento.target === fondo) fondo.remove() })
  document.body.appendChild(fondo)

  document.getElementById('prod-foto').addEventListener('change', evento => {
    archivoProductoSeleccionado = evento.target.files?.[0] || null
    document.getElementById('prod-foto-nombre').textContent = archivoProductoSeleccionado?.name || 'Ningún archivo seleccionado'
  })
  document.getElementById('form-producto').addEventListener('submit', guardarProductoNuevo)
  document.getElementById('prod-nombre').focus()
}

async function guardarProductoNuevo(evento) {
  evento.preventDefault()
  const boton = document.getElementById('btn-guardar-producto')
  boton.disabled = true
  boton.textContent = 'Guardando...'

  try {
    let imagenUrl = null
    if (archivoProductoSeleccionado) {
      const extension = (archivoProductoSeleccionado.name.split('.').pop() || 'jpg').toLowerCase()
      const ruta = `menu-productos/${TENANT_ID}/${crypto.randomUUID()}.${extension}`
      const { error: errorSubida } = await db.storage.from('anuncios').upload(ruta, archivoProductoSeleccionado, { upsert: true })
      if (errorSubida) throw errorSubida
      const { data: urlData } = db.storage.from('anuncios').getPublicUrl(ruta)
      imagenUrl = urlData?.publicUrl || null
    }

    const categoriaId = document.getElementById('prod-categoria').value
    const payload = {
      tenant_id: TENANT_ID,
      sucursal_id: SUCURSAL_ID,
      categoria_id: categoriaId ? Number(categoriaId) : null,
      nombre: document.getElementById('prod-nombre').value.trim(),
      descripcion: document.getElementById('prod-descripcion').value.trim() || null,
      precio: Number(document.getElementById('prod-precio').value) || 0,
      imagen_url: imagenUrl,
      disponible: true,
      orden: productos.length
    }
    const { error } = await db.from('menu_productos').insert(payload)
    if (error) throw error

    document.getElementById('modal-producto')?.remove()
    mostrarToast('Producto agregado')
    await cargarMenuCocina()
  } catch (error) {
    console.error('[cocina] Error al guardar producto:', error)
    mostrarToast('No se pudo guardar el producto', true)
    boton.disabled = false
    boton.textContent = 'Guardar'
  }
}

db.auth.onAuthStateChange(evento => {
  if (evento === 'SIGNED_OUT') window.location.href = 'login.html'
})

iniciarPanel()
</script>
